<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="theme-color" content="#1d2b53" />
  <title>Max's Maple Quest</title>
  <style>
    @font-face { font-family: 'PressStart'; src: url('./assets/PressStart2P-Regular.ttf'); }
    @font-face { font-family: 'Lilita'; src: url('./assets/LilitaOne-Regular.ttf'); }
    html, body { margin: 0; height: 100%; background: #1d2b53; overflow: hidden; overscroll-behavior: none;
      touch-action: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
    body { position: fixed; inset: 0; }
    #game { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
      padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); }
    #rotate { display: none; position: fixed; inset: 0; z-index: 10; background: #1d2b53; color: #fff36b;
      font-family: 'Lilita', sans-serif; font-size: 26px; text-align: center; flex-direction: column; align-items: center; justify-content: center; gap: 18px; }
    #rotate small { font-family: 'PressStart', monospace; font-size: 10px; color: #a9c1ff; line-height: 1.8; }
    #rotate .phone { width: 46px; height: 80px; border: 5px solid #fff; border-radius: 9px; animation: tip 1.8s ease-in-out infinite; }
    @keyframes tip { 0%, 25% { transform: rotate(0deg); } 60%, 100% { transform: rotate(-90deg); } }
    @media (orientation: portrait) and (pointer: coarse) { #rotate { display: flex; } }
    html.force-portrait-prompt #rotate { display: flex; }
    canvas { image-rendering: pixelated; }
    /* preload fonts so Phaser text can use them immediately */
    .fontload { font-family: 'PressStart', 'Lilita'; position: absolute; left: -999px; }
  </style>
</head>
<body>
  <div class="fontload">.<span style="font-family:Lilita">.</span></div>
  <div id="game"></div>
  <div id="rotate"><div class="phone"></div><div>Turn your phone sideways</div><small>Max's Maple Quest plays in landscape</small></div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
